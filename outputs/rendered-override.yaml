---
# Source: webapp/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: webrelease-webapp
  labels:
    helm.sh/chart: webapp-0.1.0
    app.kubernetes.io/name: webapp
    app.kubernetes.io/instance: webrelease
    app.kubernetes.io/version: "2.4"
    app.kubernetes.io/managed-by: Helm
automountServiceAccountToken: true

---
# Source: webapp/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: webrelease-webapp
  labels:
    helm.sh/chart: webapp-0.1.0
    app.kubernetes.io/name: webapp
    app.kubernetes.io/instance: webrelease
    app.kubernetes.io/version: "2.4"
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: webapp
    app.kubernetes.io/instance: webrelease

---
# Source: webapp/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webrelease-webapp
  labels:
    helm.sh/chart: webapp-0.1.0
    app.kubernetes.io/name: webapp
    app.kubernetes.io/instance: webrelease
    app.kubernetes.io/version: "2.4"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: webapp
      app.kubernetes.io/instance: webrelease
  template:
    metadata:
      labels:
        helm.sh/chart: webapp-0.1.0
        app.kubernetes.io/name: webapp
        app.kubernetes.io/instance: webrelease
        app.kubernetes.io/version: "2.4"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: webrelease-webapp
      containers:
        - name: webapp
          image: "httpd:2.4.62"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
---
# Source: webapp/templates/tests/test-connection.yaml
apiVersion: v1
kind: Pod
metadata:
  name: "webrelease-webapp-test-connection"
  labels:
    helm.sh/chart: webapp-0.1.0
    app.kubernetes.io/name: webapp
    app.kubernetes.io/instance: webrelease
    app.kubernetes.io/version: "2.4"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['webrelease-webapp:80']
  restartPolicy: Never

